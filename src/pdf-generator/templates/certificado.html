<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Certificado</title>
  <style>
    body {
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
    }
    .cert-container {
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      border-radius: 0.5rem;
      padding: 3rem;
      max-width: 900px;
      width: 100%;
      border: 4px solid #d4af37; /* dorado */
      position: relative;
      background-image: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
    }
    .cert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cert-logo {
      border-radius: 10px;
      width: 100px;
    }
    .cert-title {
      font-size: 2.5rem;
      font-weight: bold;
      color: #d4af37;
      text-align: center;
      margin: 1rem 0 0.5rem 0;
      text-transform: uppercase;
    }
    .cert-subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }
    .cert-name {
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1rem;
      font-family: 'Brush Script MT', cursive;
      color: #1f2937;
    }
    .cert-course {
      text-align: center;
      color: #374151;
      margin-bottom: 2rem;
    }
    .cert-course span {
      font-weight: bold;
      color: #1d4ed8;
    }
    .cert-signatures {
      display: flex;
      justify-content: space-between;
      margin-top: 3rem;
    }
    .cert-sign {
      text-align: center;
    }
    .cert-sign hr {
      border: none;
      border-top: 1px solid #374151;
      width: 200px;
      margin: 0.5rem auto;
    }
    .cert-sign p {
      font-size: 0.9rem;
      color: #374151;
      margin-top: 0.3rem;
    }
    .badge {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: #1d4ed8;
      color: white;
      padding: 1rem;
      border-radius: 50%;
      font-weight: bold;
      border: 4px solid #d4af37;
      text-align: center;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      line-height: 1rem;
    }
  </style>
</head>
